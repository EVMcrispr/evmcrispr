name: Main
on:
  pull_request:
  push:
    branches: [master, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun is the package manager, script runner and test runner. Node is
      # still installed for tool binaries with node shebangs (astro, vite);
      # it must be modern enough for them (CustomEvent global needs >= 19).
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install Dependencies
        run: bun i

      - name: Check module registry is in sync
        run: bun scripts/sync-modules.ts --check

      - name: Get changed files from evmcrispr
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            packages/core/{src,test}/**
            packages/sdk/{src,test}/**
            packages/test-utils/**
            modules/**

      - name: Build
        run: bun run build

      - name: Lint code
        run: bun run lint

      - name: Check types
        run: bun run type-check

      # The sim backend "unit" suites fork gnosis through DRPC, so the key
      # is needed here too, not just for integration tests.
      - name: Unit Tests
        run: |
          echo "VITE_DRPC_API_KEY=$VITE_DRPC_API_KEY" >> .env
          bun run test:unit
        env:
          VITE_DRPC_API_KEY: ${{ secrets.VITE_DRPC_API_KEY }}

      - name: Integration Tests
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "VITE_DRPC_API_KEY=$VITE_DRPC_API_KEY" >> .env
          echo "VITE_PINATA_JWT=$VITE_PINATA_JWT" >> .env
          bun run test:integration
        env:
          VITE_DRPC_API_KEY: ${{ secrets.VITE_DRPC_API_KEY }}
          VITE_PINATA_JWT: ${{ secrets.VITE_PINATA_JWT }}

[package]
name = "revm-sim"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact pin: revm's embedding API churns between majors. Pure-Rust crypto only —
# the default `secp256k1`/`c-kzg`/`blst` features need clang and don't build for
# wasm32-unknown-unknown; without them revm falls back to k256/ark-bn254/ark-bls12-381.
revm = { version = "=42.0.1", default-features = false, features = [
  "std",
  "serde",
  "optional_balance_check",
  "optional_block_gas_limit",
  "optional_eip3607",
  "optional_no_base_fee",
] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Transitive dep of the ark/k256 crypto stack; wasm32-unknown-unknown has no
# entropy source unless the JS shim is enabled.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
strip = true

# wasm-pack's bundled binaryen is too old for the wasm this toolchain emits
# ("error validating input"); opt-level=z + lto already keeps the artifact small.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
